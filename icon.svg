<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>LootView</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182133"/>
      <stop offset="1" stop-color="#060910"/>
    </linearGradient>
    <linearGradient id="topGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FB8E0" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#6FB8E0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="goldPool" cx="0.28" cy="0.96" r="0.66">
      <stop offset="0" stop-color="#D6B068" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#D6B068" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.46">
      <stop offset="0" stop-color="#D6B068" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#D6B068" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panelClip">
      <rect width="512" height="512" rx="104"/>
    </clipPath>
  </defs>

  <!-- Panel: the deep-navy glass every LootView window is built from -->
  <g clip-path="url(#panelClip)">
    <rect width="512" height="512" fill="url(#panel)"/>
    <rect width="512" height="266" fill="url(#topGlow)"/>
    <rect width="512" height="512" fill="url(#goldPool)"/>
    <rect width="512" height="512" fill="url(#halo)"/>
  </g>

  <!-- Brass frame and corner filigree -->
  <rect x="36" y="36" width="440" height="440"
        rx="72" fill="none" stroke="#D6B068" stroke-opacity="0.50" stroke-width="3.5"/>
  <g fill="none" stroke="#F2D796" stroke-opacity="0.78" stroke-width="5.0"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M 57.6 91.6 L 57.6 57.6 L 91.6 57.6"/>
    <path d="M 454.4 91.6 L 454.4 57.6 L 420.4 57.6"/>
    <path d="M 57.6 420.4 L 57.6 454.4 L 91.6 454.4"/>
    <path d="M 454.4 420.4 L 454.4 454.4 L 420.4 454.4"/>
  </g>

  <!-- The aetheryte crest, cut into gem facets -->
  <g>
    <polygon points="256.0,98.0 135.0,256.0 200.3,256.0" fill="#E6C882"/>
    <polygon points="256.0,98.0 200.3,256.0 256.0,256.0" fill="#FFF3D2"/>
    <polygon points="256.0,98.0 256.0,256.0 311.7,256.0" fill="#DFB96E"/>
    <polygon points="256.0,98.0 311.7,256.0 377.0,256.0" fill="#BE9650"/>
    <polygon points="256.0,414.0 135.0,256.0 200.3,256.0" fill="#AD8845"/>
    <polygon points="256.0,414.0 200.3,256.0 256.0,256.0" fill="#CDA860"/>
    <polygon points="256.0,414.0 256.0,256.0 311.7,256.0" fill="#9E7F3C"/>
    <polygon points="256.0,414.0 311.7,256.0 377.0,256.0" fill="#6B5326"/>
    <g stroke="#5A461E" stroke-opacity="0.45" stroke-width="1.8">
      <line x1="256.0" y1="98.0" x2="200.3" y2="256.0"/>
      <line x1="256.0" y1="98.0" x2="256.0" y2="256.0"/>
      <line x1="256.0" y1="98.0" x2="311.7" y2="256.0"/>
      <line x1="256.0" y1="414.0" x2="200.3" y2="256.0"/>
      <line x1="256.0" y1="414.0" x2="256.0" y2="256.0"/>
      <line x1="256.0" y1="414.0" x2="311.7" y2="256.0"/>
      <line x1="135.0" y1="256.0" x2="377.0" y2="256.0"/>
    </g>
    <polygon points="256.0,98.0 377.0,256.0 256.0,414.0 135.0,256.0"
             fill="#FFFFFF" opacity="0.0"/>
    <polygon points="247.0,124.0 212.0,172.0 230.0,184.0 259.0,140.0" fill="#FFFFFF" opacity="0.30"/>
    <polygon points="256.0,98.0 377.0,256.0 256.0,414.0 135.0,256.0"
             fill="none" stroke="#F2D796" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Motes, echoing the overlay's drop particles -->
  <g opacity="0.92"><polygon points="116.0,136.0 118.2,147.8 130.0,150.0 118.2,152.2 116.0,164.0 113.8,152.2 102.0,150.0 113.8,147.8" fill="#F2D796"/><circle cx="116.0" cy="150.0" r="2.80" fill="#FFFFFF"/></g>
  <g opacity="0.70"><polygon points="398.0,177.0 399.4,184.6 407.0,186.0 399.4,187.4 398.0,195.0 396.6,187.4 389.0,186.0 396.6,184.6" fill="#F2D796"/><circle cx="398.0" cy="186.0" r="1.80" fill="#FFFFFF"/></g>
  <g opacity="0.58"><polygon points="140.0,358.0 141.3,364.7 148.0,366.0 141.3,367.3 140.0,374.0 138.7,367.3 132.0,366.0 138.7,364.7" fill="#F2D796"/><circle cx="140.0" cy="366.0" r="1.60" fill="#FFFFFF"/></g>
  <g opacity="0.80"><polygon points="392.0,338.0 393.9,348.1 404.0,350.0 393.9,351.9 392.0,362.0 390.1,351.9 380.0,350.0 390.1,348.1" fill="#F2D796"/><circle cx="392.0" cy="350.0" r="2.40" fill="#FFFFFF"/></g>
</svg>
